global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["host.docker.internal:9093"]

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "orders-service"
    static_configs:
      - targets: ["host.docker.internal:8000"]